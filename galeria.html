<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Galería - Leo Ramirez</title>
    <meta name="description"
        content="Galería fotográfica del trabajo y los recorridos de Leo Ramirez en Melchor Ocampo.">

    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700" rel="stylesheet" />

    <link href="assets/img/licono.png" rel="icon" type="image/png">
    <link href="assets/img/leoiconapple.png" rel="apple-touch-icon" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link href="css/styles.css" rel="stylesheet" />

    <style>
        .galeria-img {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 8px;
            object-fit: cover;
            aspect-ratio: 4/3;
        }

        .galeria-img:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>

    <!-- Navegación Lateral -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
        <a class="navbar-brand js-scroll-trigger" href="index.html">
            <span class="d-block d-lg-none">Momentos</span>
            <span class="d-none d-lg-block profile-img">
                <img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="assets/img/leo_fondo.jpeg"
                    alt="Leo Ramirez" />
            </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
            aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-arrow-left me-2"></i>Volver
                        al Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="#galeria">Galería</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container-fluid p-0" style="background-color: #fbfbfb;">

        <section class="historia-encabezado p-4 p-lg-5 position-relative">
            <div class="kiosco-bg d-none d-md-block" style="background-image: url('assets/img/galeria_bg.jpg');"></div>

            <div class="row position-relative" style="z-index: 2;">
                <div class="col-lg-7">
                
                    <h1 class="display-4 fw-bold mt-2 mb-4"
                        style="color: #212529; font-family: 'Saira Extra Condensed', sans-serif; text-transform: uppercase;">
                        MOMENTOS QUE<br>CONSTRUYEN HISTORIA
                    </h1>
                    <p class="lead" style="color: #555; max-width: 480px;">
                        Imágenes que reflejan el trabajo diario, la cercanía con la gente y nuestro compromiso continuo
                        con Melchor Ocampo.
                    </p>
                </div>
            </div>
        </section>

        <!-- Cuadrícula de Galería -->
        <section class="p-4 p-lg-5">
            <div class="row g-4" id="galeria">

                <!-- Foto 1 -->
                <div class="col-sm-6 col-md-4 col-lg-4">
                    <div class="galeria-item rounded-4 overflow-hidden shadow-sm position-relative h-100">
                        <img src="assets/img/gal1.jpg" class="img-fluid w-100" alt="Caminata con la comunidad">

                        <div class="galeria-overlay d-flex align-items-end p-3">
                            <h5 class="text-white fw-bold mb-0"
                                style="font-family: 'Saira Extra Condensed', sans-serif; letter-spacing: 1px;">
                                <i class="fas fa-map-marker-alt text-gold me-2"></i>
                            </h5>
                        </div>
                    </div>
                </div>

                <!-- Foto 2 -->
                <div class="col-sm-6 col-md-4 col-lg-4">
                    <div class="galeria-item rounded-4 overflow-hidden shadow-sm position-relative h-100">
                        <img src="assets/img/gal2.jpg" class="img-fluid w-100" alt="Jornada de salud">
                        <div class="galeria-overlay d-flex align-items-end p-3">
                            <h5 class="text-white fw-bold mb-0"
                                style="font-family: 'Saira Extra Condensed', sans-serif; letter-spacing: 1px;">
                                <i class="fas fa-eye text-gold me-2"></i>
                            </h5>
                        </div>
                    </div>
                </div>

                <!-- Foto 3 -->
                <div class="col-sm-6 col-md-4 col-lg-4">
                    <div class="galeria-item rounded-4 overflow-hidden shadow-sm position-relative h-100">
                        <img src="assets/img/gal3.jpg" class="img-fluid w-100" alt="Apoyo a educación">
                        <div class="galeria-overlay d-flex align-items-end p-3">
                            <h5 class="text-white fw-bold mb-0"
                                style="font-family: 'Saira Extra Condensed', sans-serif; letter-spacing: 1px;">
                                <i class="fas fa-lightbulb text-gold me-2"></i>Instalación de luminarias
                            </h5>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-md-4 col-lg-4">
                    <div class="galeria-item rounded-4 overflow-hidden shadow-sm position-relative h-100">
                        <img src="assets/img/gal4.jpg" class="img-fluid w-100" alt="Cursos y oficios">
                        <div class="galeria-overlay d-flex align-items-end p-3">
                            <h5 class="text-white fw-bold mb-0"
                                style="font-family: 'Saira Extra Condensed', sans-serif; letter-spacing: 1px;">
                                <i class="fas fa-tools text-gold me-2"></i>
                            </h5>
                        </div>
                    </div>
                </div>

                <!-- Foto 5 -->
                <div class="col-sm-6 col-md-4 col-lg-4">
                    <div class="galeria-item rounded-4 overflow-hidden shadow-sm position-relative h-100">
                        <img src="assets/img/gal23.jpg" class="img-fluid w-100" alt="Reunión con vecinos">
                        <div class="galeria-overlay d-flex align-items-end p-3">
                            <h5 class="text-white fw-bold mb-0"
                                style="font-family: 'Saira Extra Condensed', sans-serif; letter-spacing: 1px;">
                                <i class="fas fa-users text-gold me-2"></i>
                            </h5>
                        </div>
                    </div>
                </div>

                <!-- Foto 6 -->
                <div class="col-sm-6 col-md-4 col-lg-4">
                    <div class="galeria-item rounded-4 overflow-hidden shadow-sm position-relative h-100">
                        <img src="assets/img/gal6.jpg" class="img-fluid w-100" alt="Seguridad pública">
                        <div class="galeria-overlay d-flex align-items-end p-3">
                            <h5 class="text-white fw-bold mb-0"
                                style="font-family: 'Saira Extra Condensed', sans-serif; letter-spacing: 1px;">
                                <i class="fas fa-lightbulb text-gold me-2"></i>
                            </h5>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <section class="py-4 text-center text-white" style="background-color: #66001a;">
            <div class="container">
                <h4 class="mb-0" style="font-family: 'Saira Extra Condensed', sans-serif; letter-spacing: 1px;">
                    CON VALOR Y CORAZÓN POR MELCHOR OCAMPO
                </h4>
            </div>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>

</html>
